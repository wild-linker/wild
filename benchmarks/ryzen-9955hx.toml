name = "ryzen-9955hx"

[defaults]
filesystem = "tmpfs"
delete-output = false

[bench.bevy-dylib]
skip_linkers = ["bfd"]

[bench.c-hello-world]

[bench.chrome]
min_wild_version = "0.6.0"
skip_linkers = ["bfd"]

[bench.chrome-crel]
min_wild_version = "0.8.0"
skip_linkers = ["bfd"]

[bench.clang-debug]
skip_linkers = ["bfd"]

[bench.clang-release]
skip_linkers = ["bfd"]

[bench.mold-crel]
min_wild_version = "0.8.0"
skip_linkers = ["bfd"]

[bench.ripgrep]

[bench.rust-analyzer]
skip_linkers = ["bfd"]

[bench.rust-analyzer-riscv]
skip_linkers = ["bfd"]
min_wild_version = "0.6.0"

[bench.rust-hello-world]

[bench.librustc-driver]
skip_linkers = ["bfd"]

[bench.wild]
skip_linkers = ["bfd"]

[bench.wild-lto]
min_wild_version = "0.9.0"

[bench.wild-riscv]
min_wild_version = "0.6.0"
skip_linkers = ["bfd"]

[bench.zed-release]
skip_linkers = ["bfd"]

[bench.zed-debug]
skip_linkers = ["bfd"]

[bench.zed-debug.variants.ext4-no-delete-output]
filesystem = "ext4"
delete-output = false

[bench.zed-debug.variants.ext4-delete-output]
filesystem = "ext4"
delete-output = true

[bench.zed-debug.variants.xfs-delete-output]
filesystem = "xfs"
delete-output = true

[bench.zed-debug.variants.btrfs-delete-output]
filesystem = "btrfs"
delete-output = true

[bench.zed-debug.variants.threads-tmpfs]
threads = "1-32"
latest-only = true

[bench.zed-debug.variants.threads-ext4-delete-output]
threads = "1-32"
latest-only = true
filesystem = "ext4"
delete-output = true

[bench.clang-debug-strip]
skip_linkers = ["bfd"]

[bench.chrome-android]
min_wild_version = "0.9.0"
skip_linkers = ["bfd"]

[bench.wild-aarch64]
skip_linkers = ["bfd"]
min_wild_version = "0.9.0"

[bench.wild-debug]

[bench.wild-loongarch64]
skip_linkers = ["bfd"]
min_wild_version = "0.9.0"

[bench.mold-gdb-index]
skip_linkers = ["bfd"]
min_wild_version = "0.10.0"
