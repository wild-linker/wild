name: Linux performance guard

on:
  pull_request:
    branches: ['**']

permissions:
  contents: read

concurrency:
  group: performance-guard-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  compare:
    name: Compare exact merge base and PR head (report-only calibration)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CARGO_TERM_COLOR: always
      RUST_TOOLCHAIN: 1.98.1
    steps:
      - name: Checkout exact candidate head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.0
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
          path: candidate
      - name: Resolve exact merge base
        id: revisions
        working-directory: candidate
        shell: bash
        env:
          BASE_REF: ${{ github.base_ref }}
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin "$BASE_REF:refs/remotes/origin/$BASE_REF"
          base_sha=$(git merge-base HEAD "origin/$BASE_REF")
          candidate_sha=$(git rev-parse HEAD)
          test "$candidate_sha" = "$EXPECTED_HEAD"
          # Output must match upstream wild, so equivalence is checked against the newest commit of
          # this repository's `upstream` branch (a mirror of wild-linker/wild main) that the PR
          # contains, rather than against the fork's merge base.
          git fetch --no-tags origin upstream:refs/remotes/origin/upstream
          upstream_sha=$(git merge-base HEAD origin/upstream)
          {
            echo "base=$base_sha"
            echo "candidate=$candidate_sha"
            echo "upstream=$upstream_sha"
          } >> "$GITHUB_OUTPUT"
      - name: Checkout merge base
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.0
        with:
          ref: ${{ steps.revisions.outputs.base }}
          persist-credentials: false
          path: baseline
      - name: Checkout upstream reference
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.0
        with:
          ref: ${{ steps.revisions.outputs.upstream }}
          persist-credentials: false
          path: upstream
      - name: Checkout trusted performance guard
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.0
        with:
          ref: e5b85389d4aa9a74a33ad9c63a57dc9fe324a1c6
          persist-credentials: false
          path: trusted-action
          sparse-checkout: |
            .github/actions/performance-guard
            benchmarks/performance_guard
          sparse-checkout-cone-mode: false
      - name: Install pinned Rust toolchain
        uses: zackees/setup-soldr@v0
        with:
          cache: true
          # wild never caches Rust toolchains (#18): rustup installs them in each
          # job, and setup-soldr skips its toolchain scans with the cache off.
          solo-toolchain-cache: false
          # Sources live under baseline/ and candidate/, so there is no
          # root Cargo.lock for setup-soldr's yank audit and cache key.
          lockfile: candidate/Cargo.lock
      - name: Install pinned toolchain for both revisions
        shell: bash
        run: rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
      - name: Build both revisions identically
        shell: bash
        run: |
          set -euo pipefail
          RUSTUP_TOOLCHAIN="$RUST_TOOLCHAIN" soldr cargo build --manifest-path baseline/Cargo.toml --package wild-linker --profile release
          RUSTUP_TOOLCHAIN="$RUST_TOOLCHAIN" soldr cargo build --manifest-path candidate/Cargo.toml --package wild-linker --profile release
          # Upstream has no rust-toolchain.toml; build it with the same pinned toolchain.
          RUSTUP_TOOLCHAIN="$RUST_TOOLCHAIN" SOLDR_ALLOW_UNPINNED=1 soldr cargo build --manifest-path upstream/Cargo.toml --package wild-linker --profile release
          mkdir -p "$RUNNER_TEMP/wild-performance-binaries"
          cp baseline/target/release/wild "$RUNNER_TEMP/wild-performance-binaries/baseline-wild"
          cp candidate/target/release/wild "$RUNNER_TEMP/wild-performance-binaries/candidate-wild"
          cp upstream/target/release/wild "$RUNNER_TEMP/wild-performance-binaries/upstream-wild"
          chmod 0555 "$RUNNER_TEMP/wild-performance-binaries/"*
          sha256sum "$RUNNER_TEMP/wild-performance-binaries/"* > "$RUNNER_TEMP/wild-performance-binaries/SHA256SUMS"
      - name: Record environment metadata
        shell: bash
        run: |
          mkdir -p candidate/performance-evidence
          {
            echo "baseline_sha=${{ steps.revisions.outputs.base }}"
            echo "candidate_sha=${{ steps.revisions.outputs.candidate }}"
            echo "upstream_sha=${{ steps.revisions.outputs.upstream }}"
            echo "runner_image=${ImageOS:-unknown}-${ImageVersion:-unknown}"
            uname -a
            lscpu
            rustc +"$RUST_TOOLCHAIN" -vV
            clang --version
            cat /sys/devices/system/cpu/cpu0/cpufreq/scaling_governor 2>/dev/null || true
            cat /proc/sys/kernel/perf_event_paranoid 2>/dev/null || true
          } > candidate/performance-evidence/environment.txt
          cp "$RUNNER_TEMP/wild-performance-binaries/SHA256SUMS" candidate/performance-evidence/
      - name: Run trusted repository-owned guard
        uses: ./trusted-action/.github/actions/performance-guard
        with:
          baseline: ${{ runner.temp }}/wild-performance-binaries/baseline-wild
          candidate: ${{ runner.temp }}/wild-performance-binaries/candidate-wild
          baseline-sha: ${{ steps.revisions.outputs.base }}
          candidate-sha: ${{ steps.revisions.outputs.candidate }}
          reference: ${{ runner.temp }}/wild-performance-binaries/upstream-wild
          reference-sha: ${{ steps.revisions.outputs.upstream }}
          performance-claim: ${{ contains(github.event.pull_request.labels.*.name, 'performance') }}
          output: candidate/performance-evidence
      - name: Upload machine-readable evidence and chart
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: performance-guard-${{ steps.revisions.outputs.candidate }}
          path: candidate/performance-evidence/
          if-no-files-found: error
          retention-days: 30

  capture-ab:
    # Real links, where the synthetic guard workloads above are too small to show write-phase
    # work. Two of the benchmarks from benchmarks/performance_guard/README.md fit a hosted runner:
    # `wild-lto-debug` (Wild built with fat LTO and full debug info, one ~250 MB object) and
    # `wild` (Wild's ordinary release build). Both are captured with WILD_SAVE_BASE and relinked
    # by the merge base and the PR head, interleaved, into the per-benchmark statistics table that
    # upstream performance PRs carry. The PR head's output must also match upstream wild's byte for
    # byte. Runs on PRs labelled `performance`.
    name: Real link A/B tables (merge base vs PR head, upstream byte identity)
    if: contains(github.event.pull_request.labels.*.name, 'performance')
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CARGO_TERM_COLOR: always
      RUST_TOOLCHAIN: 1.98.1
    steps:
      - name: Checkout exact candidate head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.0
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
          path: candidate
      - name: Resolve merge base and upstream reference
        id: revisions
        working-directory: candidate
        shell: bash
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin "$BASE_REF:refs/remotes/origin/$BASE_REF"
          git fetch --no-tags https://github.com/wild-linker/wild.git main:refs/remotes/upstream/main
          # The upstream reference is the newest upstream commit this PR contains, so identity is
          # checked against the upstream code the fork is built on.
          {
            echo "base=$(git merge-base HEAD "origin/$BASE_REF")"
            echo "candidate=$(git rev-parse HEAD)"
            echo "upstream=$(git merge-base HEAD upstream/main)"
          } >> "$GITHUB_OUTPUT"
      - name: Create worktrees for merge base and upstream
        working-directory: candidate
        shell: bash
        run: |
          set -euo pipefail
          git worktree add --detach ../baseline "${{ steps.revisions.outputs.base }}"
          git worktree add --detach ../upstream "${{ steps.revisions.outputs.upstream }}"
      - name: Install pinned Rust toolchain
        uses: zackees/setup-soldr@v0
        with:
          cache: true
          solo-toolchain-cache: false
          lockfile: candidate/Cargo.lock
      - name: Build baseline, candidate and upstream identically
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
          mkdir -p "$RUNNER_TEMP/bins"
          for tree in baseline candidate upstream; do
            RUSTUP_TOOLCHAIN="$RUST_TOOLCHAIN" SOLDR_ALLOW_UNPINNED=1 soldr cargo build \
              --manifest-path "$tree/Cargo.toml" --package wild-linker --profile release
            cp "$tree/target/release/wild" "$RUNNER_TEMP/bins/$tree-wild"
          done
          sha256sum "$RUNNER_TEMP/bins/"*
      - name: Test the PR's performance tooling
        shell: bash
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python3 -m unittest discover -s candidate/benchmarks/performance_guard -p 'test_*.py' -v
      - name: Capture Wild's own links (wild-lto-debug and wild)
        shell: bash
        run: |
          set -euo pipefail
          shopt -s inherit_errexit
          # Plain cargo: soldr's compile cache isn't wanted for one-off capture builds.
          # Prints the save-dir of the wild binary's own link (build scripts are captured too).
          capture_wild() {
            local name=$1
            shift
            (cd candidate && env -u CLICOLOR_FORCE -u FORCE_COLOR \
              RUSTUP_TOOLCHAIN="$RUST_TOOLCHAIN" \
              CARGO_TARGET_DIR="$RUNNER_TEMP/target-$name" \
              CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_LINKER=clang \
              RUSTFLAGS="-Clink-arg=--ld-path=$RUNNER_TEMP/bins/baseline-wild" \
              WILD_SAVE_BASE="$RUNNER_TEMP/capture-$name" \
              "$@" cargo build --release --package wild-linker --bin wild >&2)
            local dir
            dir=$(dirname "$(grep -l -E '^# Original output file: .*/wild-[0-9a-f]+$' \
              "$RUNNER_TEMP/capture-$name"/*/run-with | head -1)")
            du -sh "$dir" >&2
            echo "$dir"
          }
          lto=$(capture_wild wild-lto-debug env \
            CARGO_PROFILE_RELEASE_LTO=fat \
            CARGO_PROFILE_RELEASE_DEBUG=full \
            CARGO_PROFILE_RELEASE_CODEGEN_UNITS=1)
          plain=$(capture_wild wild env)
          {
            echo "CAPTURE_WILD_LTO_DEBUG=$lto"
            echo "CAPTURE_WILD=$plain"
          } >> "$GITHUB_ENV"
      - name: Paired A/B tables with upstream byte identity
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          base=${{ steps.revisions.outputs.base }}
          cand=${{ steps.revisions.outputs.candidate }}
          {
            echo "## Real link A/B"
            echo
            echo "- #1 baseline (merge base): \`$base\`"
            echo "- #2 candidate (PR head): \`$cand\`"
            echo "- Upstream reference for byte identity: \`${{ steps.revisions.outputs.upstream }}\`"
            echo "- Runner: $(nproc) CPUs, $(grep -m1 'model name' /proc/cpuinfo | cut -d: -f2)"
            echo
            echo "Tables compare against the fork's merge base, not upstream main; see"
            echo "benchmarks/performance_guard/README.md for the upstream-PR table."
            echo
          } > evidence/summary.md
          status=0
          for bench in wild-lto-debug wild; do
            case $bench in
              wild-lto-debug) capture=$CAPTURE_WILD_LTO_DEBUG ;;
              wild) capture=$CAPTURE_WILD ;;
            esac
            printf '### %s\n\n' "$bench" >> evidence/summary.md
            ab=(python3 candidate/benchmarks/performance_guard/capture_ab.py
              --capture "$capture" --benchmark "$bench"
              --baseline "$RUNNER_TEMP/bins/baseline-wild" --baseline-label "merge-base ${base:0:12}"
              --candidate "$RUNNER_TEMP/bins/candidate-wild" --candidate-label "pr-head ${cand:0:12}"
              --reference "$RUNNER_TEMP/bins/upstream-wild")
            # The table: the capture's own arguments, with --no-fork so rusage is the linker's.
            "${ab[@]}" --extra=--no-fork --pairs 30 --max-pairs 5000 --budget-seconds 240 \
              --output "evidence/table-$bench.json" --markdown evidence/summary.md || status=1
            # Ubuntu's clang passes --build-id, so the capture has one; a later flag overrides it.
            for mode in none fast; do
              printf '\nIdentity with `--build-id=%s`:\n\n' "$mode" >> evidence/summary.md
              "${ab[@]}" --extra="--build-id=$mode --no-fork" --pairs 0 --warmups 1 \
                --output "evidence/identity-$bench-$mode.json" --markdown evidence/summary.md || status=1
            done
            echo >> evidence/summary.md
          done
          cat evidence/summary.md >> "$GITHUB_STEP_SUMMARY"
          python3 candidate/benchmarks/performance_guard/pr_table.py evidence/table-*.json \
            > evidence/pr-table.md || status=1
          exit $status
      - name: Upload A/B evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: capture-ab-${{ steps.revisions.outputs.candidate }}
          path: evidence/
          if-no-files-found: warn
          retention-days: 30
