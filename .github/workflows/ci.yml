name: CI

on:
  push:
    branches: ['main']
  pull_request:
    branches: ['**']
  workflow_dispatch:

permissions:
  packages: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: '-D warnings'

jobs:
  test-nightly:
    name: Test Linux (${{ matrix.container }})

    strategy:
      matrix:
        include:
          - runs-on: ubuntu-24.04
            container: ci-ubuntu-cross-amd64
            cross: all
          - runs-on: ubuntu-24.04
            container: ci-arch-cross-amd64
            cross: aarch64,riscv64
          - runs-on: ubuntu-24.04-arm
            container: ci-ubuntu-arm64
          - runs-on: ubuntu-24.04
            container: ci-alpine-amd64
          - runs-on: ubuntu-24.04
            container: ci-opensuse-amd64
          - runs-on: ubuntu-24.04-arm
            container: ci-opensuse-arm64

      fail-fast: false

    runs-on: ${{ matrix.runs-on }}
    timeout-minutes: 10
    env:
      # The CI images ship nightly with the cross targets; override rust-toolchain.toml.
      RUSTUP_TOOLCHAIN: nightly

    container:
      # Note: when updating this image hash, update the other occurrences in this file too.
      image: ghcr.io/wild-linker/wild/${{ matrix.container }}:sha-086d0ec2f071492c0931ce3aac4140720c169926

    steps:
      # https://github.com/actions/runner/issues/3210
      - run: echo "$PATH" >> "$GITHUB_PATH"
        if: ${{ contains(matrix.container, 'opensuse') }}
      - run: echo "WILD_TEST_CONFIG=test-config-ci.toml" >> $GITHUB_ENV
      - run: echo "WILD_TEST_CROSS=${{ matrix.cross }}" >> $GITHUB_ENV
        if: ${{ contains(matrix.container, '-cross') }}
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: wild-linker/action@latest
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ runner.os }}-${{ matrix.container }}-${{ matrix.runs-on }}
      - run: cargo build --profile ci --workspace --no-default-features
      - run: WILD_TEST_CROSS=$WILD_TEST_CROSS cargo test --profile ci --workspace

  external-tests:
    name: Test Linux (external tests)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      # The CI images ship nightly with the cross targets; override rust-toolchain.toml.
      RUSTUP_TOOLCHAIN: nightly
    container:
      image: "ghcr.io/wild-linker/wild/ci-ubuntu-cross-amd64:sha-086d0ec2f071492c0931ce3aac4140720c169926"
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          submodules: recursive
      - uses: Swatinem/rust-cache@v2
      - run: echo "WILD_TEST_CONFIG=test-config-ci.toml" >> $GITHUB_ENV
      - name: Check regressions
        run: WILD_TEST_CROSS=all cargo test --features external_tests external_test_suites -- --skip expect_failure
      - name: Check tests that should fail still fail
        run: WILD_TEST_CROSS=all cargo test --features external_tests expect_failure

  linux-cross-build:
    name: Build Linux (${{ matrix.arch }})
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: RISC-V
            target: riscv64gc-unknown-linux-gnu
            config: .cargo/config.toml.cross-riscv
          - arch: LoongArch64
            target: loongarch64-unknown-linux-gnu
            config: .cargo/config.toml.cross-loongarch64
          - arch: PPC64LE
            target: powerpc64le-unknown-linux-gnu
            config: .cargo/config.toml.cross-ppc64le
    container:
      image: ghcr.io/wild-linker/wild/ci-ubuntu-cross-amd64:sha-086d0ec2f071492c0931ce3aac4140720c169926
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # Cross-target builds use plain cargo: soldr's zccache wrapping and
      # linker injection would compile/link target objects with the host
      # toolchain.
      # The solo toolchain cache is keyed without targets, so a restored
      # toolchain can claim a target's rust-std is installed without its files.
      - uses: zackees/setup-soldr@v0
        with:
          cache: true
          linker: platform-default
          solo-toolchain-cache: false
      - run: rustup target add ${{ matrix.target }}
      - run: rustc --version
      - run: cp -f ${{ matrix.config }} .cargo/config.toml
      - run: cargo build --target ${{ matrix.target }}

  wasip1-build:
    name: Build wasip1
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    container:
      image: ghcr.io/wild-linker/wild/ci-ubuntu-wasm-amd64:sha-086d0ec2f071492c0931ce3aac4140720c169926
    steps:
      - name: Setup Wasmtime
        uses: bytecodealliance/actions/wasmtime/setup@v1
        with:
          version: '48.0.0'
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # Cross-target builds use plain cargo: soldr's zccache wrapping and
      # linker injection would compile/link target objects with the host
      # toolchain.
      # The solo toolchain cache is keyed without targets, so a restored
      # toolchain can claim a target's rust-std is installed without its files.
      - uses: zackees/setup-soldr@v0
        with:
          cache: true
          linker: platform-default
          solo-toolchain-cache: false
      - run: rustup target add wasm32-wasip1
      - run: rustc --version
      - run: cargo build --target wasm32-wasip1
      - run: cp -f .cargo/config.toml.cross-wasm32p1 .cargo/config.toml
      # -p libwild prevents integration tests from running. they depend on
      # spawning processes, which isn't supported on wasi.
      - run: cargo test --profile ci -p libwild --target wasm32-wasip1

  wasm-test:
    name: Test Wasm
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    container:
      image: ghcr.io/wild-linker/wild/ci-ubuntu-wasm-amd64:sha-086d0ec2f071492c0931ce3aac4140720c169926
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: zackees/setup-soldr@v0
        with:
          cache: true
          solo-toolchain-cache: false
      - run: rustup target add wasm32-wasip1
      - run: rustc --version
      - uses: taiki-e/install-action@v2.87.18
        with:
          tool: wasm-tools
      - name: Setup Wasmtime
        uses: bytecodealliance/actions/wasmtime/setup@v1
        with:
          version: '48.0.0'
      - run: soldr cargo test --features wasm -- wasm

  macho-build:
    name: Test Mach-O (AArch64)
    runs-on: macos-latest
    timeout-minutes: 10
    env:
      WILD_TEST_IGNORE_FORMAT: "1" # Checked by other jobs
    steps:
      - run: brew install lld llvm
      - run: echo "PATH=/opt/homebrew/opt/llvm/bin:$PATH" >> $GITHUB_ENV
      - run: clang --version
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: zackees/setup-soldr@v0
        with:
          cache: true
      - run: rustc --version
      - run: echo "WILD_TEST_CONFIG=test-config-ci.toml" >> $GITHUB_ENV
      - run: soldr cargo build --profile ci --workspace --no-default-features
      - run: soldr cargo test --profile ci --workspace --features macho

  windows-build:
    name: Build Windows (x86_64)
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: zackees/setup-soldr@v0
        with:
          cache: true
      - run: rustc --version
      - run: soldr cargo build --profile ci --workspace --no-default-features

  minimal-versions:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    container:
      image: ghcr.io/wild-linker/wild/ci-ubuntu-amd64:sha-086d0ec2f071492c0931ce3aac4140720c169926
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: zackees/setup-soldr@v0
        with:
          cache: true
      - run: rustc --version
      - uses: taiki-e/install-action@v2.87.18
        with:
          tool: cargo-hack,cargo-minimal-versions,taplo
      # Plain cargo: under soldr's compile cache, the cc-built plugin shim
      # object in libwild's build script goes missing before `ar` runs.
      # setup-soldr exports CLICOLOR_FORCE/FORCE_COLOR, which makes wild colour
      # its --sym-info output and breaks the link-args/sym-info regex.
      - run: env -u CLICOLOR_FORCE -u FORCE_COLOR cargo minimal-versions --direct test --profile ci

  clippy:
    name: Clippy
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      # rust-toolchain.toml selects the development toolchain; this job intentionally overrides it
      # to check the MSRV.
      RUSTUP_TOOLCHAIN: "1.98.0"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # This is where we check that we're not using features from a more recent rust version. When
      # updating this, please also update workspace.package.rust-version in `Cargo.toml`.
      # rust-toolchain.toml is the development toolchain; RUSTUP_TOOLCHAIN above overrides it here.
      - uses: dtolnay/rust-toolchain@1.98.0
        id: rust-toolchain
        with:
          components: clippy
      - run: rustc --version
      - uses: wild-linker/action@latest
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --all-targets --workspace --target x86_64-unknown-linux-gnu
      - run: cargo clippy --all-targets --workspace --target x86_64-unknown-linux-gnu --no-default-features

  cargo-deny:
    name: Cargo deny
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check

  dependency_cooldown:
    name: Dependency cooldown
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install nightly Rust
        uses: dtolnay/rust-toolchain@nightly
      - run: cp -f .cargo/config.toml.publish-age .cargo/config.toml
      - name: Check for eligible dependency updates
        run: cargo +nightly update

  rustfmt:
    name: Check formatting
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      RUSTUP_TOOLCHAIN: nightly
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  yamlfmt:
    name: yamlfmt
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26.0'
          cache: false
      - run: go install github.com/google/yamlfmt/cmd/yamlfmt@v0.21.0
      - run: echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - run: yamlfmt -lint .

  spelling:
    name: Spell Check with Typos
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Spell Check Repo
        uses: crate-ci/typos@v1.50.2

  calc-matrix:
    name: Find Nix checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.calc-matrix.outputs.matrix }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Install Nix
        uses: nixbuild/nix-quick-install-action@v35
        with:
          nix_on_tmpfs: true

      - name: Calculate check
        id: calc-matrix
        run: |
          set -euo pipefail
          matrix=$(nix flake show --json | jq -c '.checks."x86_64-linux"|keys_unsorted')
          echo "Matrix: $matrix"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  nix-checks:
    needs:
      - calc-matrix
    strategy:
      fail-fast: false
      matrix:
        check: ${{ fromJson(needs.calc-matrix.outputs.matrix) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    name: Nix/${{ matrix.check }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Install Nix
        uses: nixbuild/nix-quick-install-action@v35

      - name: Restore Nix store
        uses: nix-community/cache-nix-action/restore@v7
        id: cache
        with:
          primary-key: ${{ runner.os }}-${{ hashFiles( 'flake.lock', 'Cargo.lock') }}

      - name: Run ${{ matrix.check }}
        run: nix build .#checks.x86_64-linux.${MATRIX_CHECK} -L --show-trace
        env:
          MATRIX_CHECK: ${{ matrix.check }}

  reuse-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0
          submodules: recursive

      - name: REUSE Compliance Check
        uses: fsfe/reuse-action@v6
