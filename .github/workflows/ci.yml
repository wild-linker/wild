name: CI

on:
  push:
    branches: ['main']
    paths:
      - '**/Cargo.toml'
      - '**/Cargo.lock'
      - '.cargo/**'
      - 'rust-toolchain.toml'
      - '.github/workflows/ci.yml'
  pull_request:
    branches: ['**']
  merge_group:
    types: [checks_requested]
  # Scheduled run ensures that we don't go too long without a cache when things outside our control
  # change. e.g. the MacOS ImageVersion.
  schedule:
    - cron: '23 18 * * *'
  workflow_dispatch:

permissions:
  packages: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: '-D warnings'

jobs:
  test-nightly:
    name: Test Linux (${{ matrix.container }})

    strategy:
      matrix:
        include:
          - runs-on: ubuntu-24.04
            container: ci-ubuntu-cross-amd64
            cross: all
          - runs-on: ubuntu-24.04
            container: ci-arch-cross-amd64
            cross: aarch64,riscv64
          - runs-on: ubuntu-24.04-arm
            container: ci-ubuntu-arm64
          - runs-on: ubuntu-24.04
            container: ci-alpine-amd64
          - runs-on: ubuntu-24.04
            container: ci-opensuse-amd64
          - runs-on: ubuntu-24.04-arm
            container: ci-opensuse-arm64

      fail-fast: false

    runs-on: ${{ matrix.runs-on }}
    timeout-minutes: 10

    container:
      # Note: when updating this image hash, update the other occurrences in this file too.
      image: ghcr.io/wild-linker/wild/${{ matrix.container }}:sha-184eb1947ff17e3f3e428b868a03c517fd4f8ae9

    steps:
      # https://github.com/actions/runner/issues/3210
      - run: echo "$PATH" >> "$GITHUB_PATH"
        if: ${{ contains(matrix.container, 'opensuse') }}
      - run: echo "WILD_TEST_CONFIG=test-config-ci.toml" >> $GITHUB_ENV
      - run: echo "WILD_TEST_CROSS=${{ matrix.cross }}" >> $GITHUB_ENV
        if: ${{ contains(matrix.container, '-cross') }}
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - run: rm rust-toolchain.toml
      - uses: wild-linker/action@latest
      - uses: Swatinem/rust-cache@v2
        id: rust-cache
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
          key: ${{ runner.os }}-${{ matrix.container }}-${{ matrix.runs-on }}
      - run: cargo build --profile ci --workspace --no-default-features
        if: github.event_name == 'pull_request' || github.event_name == 'merge_group' || github.event_name == 'workflow_dispatch' || steps.rust-cache.outputs.cache-hit != 'true'
      - run: WILD_TEST_CROSS=$WILD_TEST_CROSS cargo test --profile ci --workspace -- --skip wasm/
        if: github.event_name == 'pull_request' || github.event_name == 'merge_group' || github.event_name == 'workflow_dispatch' || steps.rust-cache.outputs.cache-hit != 'true'

  external-tests:
    name: Test Linux (external tests)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    container:
      image: "ghcr.io/wild-linker/wild/ci-ubuntu-cross-amd64:sha-184eb1947ff17e3f3e428b868a03c517fd4f8ae9"
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          submodules: recursive
      - run: rm rust-toolchain.toml
      - uses: Swatinem/rust-cache@v2
        id: rust-cache
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: echo "WILD_TEST_CONFIG=test-config-ci.toml" >> $GITHUB_ENV
      - name: Check regressions
        if: github.event_name == 'pull_request' || github.event_name == 'merge_group' || github.event_name == 'workflow_dispatch' || steps.rust-cache.outputs.cache-hit != 'true'
        run: WILD_TEST_CROSS=all cargo test --features external_tests external_test_suites -- --skip expect_failure
      - name: Check tests that should fail still fail
        if: github.event_name == 'pull_request' || github.event_name == 'merge_group' || github.event_name == 'workflow_dispatch' || steps.rust-cache.outputs.cache-hit != 'true'
        run: WILD_TEST_CROSS=all cargo test --features external_tests expect_failure

  linux-cross-build:
    name: Build Linux (${{ matrix.arch }})
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: RISC-V
            target: riscv64gc-unknown-linux-gnu
            config: .cargo/config.toml.cross-riscv
          - arch: LoongArch64
            target: loongarch64-unknown-linux-gnu
            config: .cargo/config.toml.cross-loongarch64
          - arch: PPC64LE
            target: powerpc64le-unknown-linux-gnu
            config: .cargo/config.toml.cross-ppc64le
    container:
      image: ghcr.io/wild-linker/wild/ci-ubuntu-cross-amd64:sha-184eb1947ff17e3f3e428b868a03c517fd4f8ae9
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - run: rm rust-toolchain.toml
      - uses: dtolnay/rust-toolchain@1.99.1
        id: rust-toolchain
        with:
          targets: ${{ matrix.target }}
      - run: cp -f ${{ matrix.config }} .cargo/config.toml
      - uses: Swatinem/rust-cache@v2
        id: rust-cache
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
          key: ${{ matrix.target }}
      - run: cargo build --target ${{ matrix.target }}
        if: github.event_name == 'pull_request' || github.event_name == 'merge_group' || github.event_name == 'workflow_dispatch' || steps.rust-cache.outputs.cache-hit != 'true'

  wasip1-build:
    name: Build wasip1
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    container:
      image: ghcr.io/wild-linker/wild/ci-ubuntu-wasm-amd64:sha-184eb1947ff17e3f3e428b868a03c517fd4f8ae9
    steps:
      - name: Setup Wasmtime
        uses: bytecodealliance/actions/wasmtime/setup@v1
        with:
          version: '48.0.0'
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - run: rm rust-toolchain.toml
      - uses: dtolnay/rust-toolchain@1.99.1
        id: rust-toolchain
        with:
          targets: wasm32-wasip1
      - run: cp -f .cargo/config.toml.cross-wasm32p1 .cargo/config.toml
      - uses: Swatinem/rust-cache@v2
        id: rust-cache
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo build --target wasm32-wasip1
        if: github.event_name == 'pull_request' || github.event_name == 'merge_group' || github.event_name == 'workflow_dispatch' || steps.rust-cache.outputs.cache-hit != 'true'
      # -p libwild prevents integration tests from running. they depend on
      # spawning processes, which isn't supported on wasi.
      - run: cargo test --profile ci -p libwild --target wasm32-wasip1
        if: github.event_name == 'pull_request' || github.event_name == 'merge_group' || github.event_name == 'workflow_dispatch' || steps.rust-cache.outputs.cache-hit != 'true'

  wasm-test:
    name: Test Wasm
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    container:
      image: ghcr.io/wild-linker/wild/ci-ubuntu-wasm-amd64:sha-184eb1947ff17e3f3e428b868a03c517fd4f8ae9
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - run: rm rust-toolchain.toml
      - uses: dtolnay/rust-toolchain@1.99.1
        id: rust-toolchain
        with:
          targets: wasm32-wasip1
      - uses: Swatinem/rust-cache@v2
        id: rust-cache
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: taiki-e/install-action@v2.87.32
        if: github.event_name == 'pull_request' || github.event_name == 'merge_group' || github.event_name == 'workflow_dispatch' || steps.rust-cache.outputs.cache-hit != 'true'
        with:
          tool: wasm-tools
      - name: Setup Wasmtime
        if: github.event_name == 'pull_request' || github.event_name == 'merge_group' || github.event_name == 'workflow_dispatch' || steps.rust-cache.outputs.cache-hit != 'true'
        uses: bytecodealliance/actions/wasmtime/setup@v1
        with:
          version: '48.0.0'
      - run: cargo test --features wasm -- wasm
        if: github.event_name == 'pull_request' || github.event_name == 'merge_group' || github.event_name == 'workflow_dispatch' || steps.rust-cache.outputs.cache-hit != 'true'

  macho-test:
    name: Test Mach-O (AArch64)
    runs-on: macos-latest
    timeout-minutes: 10
    env:
      WILD_TEST_IGNORE_FORMAT: "1" # Checked by other jobs
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - run: rm rust-toolchain.toml
      - uses: dtolnay/rust-toolchain@1.99.1
        id: rust-toolchain
      - uses: Swatinem/rust-cache@v2
        id: rust-cache
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
          env-vars: ImageVersion
      - run: brew install lld
        if: github.event_name == 'pull_request' || github.event_name == 'merge_group' || github.event_name == 'workflow_dispatch' || steps.rust-cache.outputs.cache-hit != 'true'
      - run: clang --version
      - run: echo "WILD_TEST_CONFIG=test-config-ci.toml" >> $GITHUB_ENV
      - run: cargo build --profile ci --workspace --no-default-features
        if: github.event_name == 'pull_request' || github.event_name == 'merge_group' || github.event_name == 'workflow_dispatch' || steps.rust-cache.outputs.cache-hit != 'true'
      - run: cargo test --profile ci --workspace --features macho -- --skip wasm/
        if: github.event_name == 'pull_request' || github.event_name == 'merge_group' || github.event_name == 'workflow_dispatch' || steps.rust-cache.outputs.cache-hit != 'true'

  windows-build:
    name: Build Windows (x86_64)
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - run: rm rust-toolchain.toml
      - uses: dtolnay/rust-toolchain@1.99.1
        id: rust-toolchain
      - uses: Swatinem/rust-cache@v2
        id: rust-cache
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo build --profile ci --workspace --no-default-features
        if: github.event_name == 'pull_request' || github.event_name == 'merge_group' || github.event_name == 'workflow_dispatch' || steps.rust-cache.outputs.cache-hit != 'true'

  minimal-versions:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    container:
      image: ghcr.io/wild-linker/wild/ci-ubuntu-amd64:sha-184eb1947ff17e3f3e428b868a03c517fd4f8ae9
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - run: rm rust-toolchain.toml
      - uses: dtolnay/rust-toolchain@1.99.1
        id: rust-toolchain
      - uses: taiki-e/install-action@v2.87.32
        with:
          tool: cargo-hack,cargo-minimal-versions,taplo
      - uses: Swatinem/rust-cache@v2
        id: rust-cache
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo minimal-versions --direct test --profile ci -- --skip wasm/
        if: github.event_name == 'pull_request' || github.event_name == 'merge_group' || github.event_name == 'workflow_dispatch' || steps.rust-cache.outputs.cache-hit != 'true'

  clippy:
    name: Clippy
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - run: rm rust-toolchain.toml
      # This is where we check that we're not using features from a more recent rust version. When
      # updating this, please also update workspace.package.rust-version in `Cargo.toml`.
      - uses: dtolnay/rust-toolchain@1.99.1
        id: rust-toolchain
        with:
          components: clippy
      - uses: wild-linker/action@latest
      - uses: Swatinem/rust-cache@v2
        id: rust-cache
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo clippy --all-targets --workspace --target x86_64-unknown-linux-gnu
        if: github.event_name == 'pull_request' || github.event_name == 'merge_group' || github.event_name == 'workflow_dispatch' || steps.rust-cache.outputs.cache-hit != 'true'
      - run: cargo clippy --all-targets --workspace --target x86_64-unknown-linux-gnu --no-default-features
        if: github.event_name == 'pull_request' || github.event_name == 'merge_group' || github.event_name == 'workflow_dispatch' || steps.rust-cache.outputs.cache-hit != 'true'

  cargo-deny:
    if: github.event_name == 'pull_request' || github.event_name == 'merge_group' || github.event_name == 'workflow_dispatch'
    name: Cargo deny
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check

  dependency_cooldown:
    if: github.event_name == 'pull_request' || github.event_name == 'merge_group' || github.event_name == 'workflow_dispatch'
    name: Dependency cooldown
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - run: rm rust-toolchain.toml
      - name: Install nightly Rust
        uses: dtolnay/rust-toolchain@nightly
      - run: cp -f .cargo/config.toml.publish-age .cargo/config.toml
      - name: Check for eligible dependency updates
        run: cargo +nightly update

  rustfmt:
    if: github.event_name == 'pull_request' || github.event_name == 'merge_group' || github.event_name == 'workflow_dispatch'
    name: Check formatting
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - run: rm rust-toolchain.toml
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  yamlfmt:
    if: github.event_name == 'pull_request' || github.event_name == 'merge_group' || github.event_name == 'workflow_dispatch'
    name: yamlfmt
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26.0'
          cache: false
      - run: go install github.com/google/yamlfmt/cmd/yamlfmt@v0.21.0
      - run: echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - run: yamlfmt -lint .

  spelling:
    if: github.event_name == 'pull_request' || github.event_name == 'merge_group' || github.event_name == 'workflow_dispatch'
    name: Spell Check with Typos
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Spell Check Repo
        uses: crate-ci/typos@v1.51.1

  nix-checks:
    if: github.event_name == 'pull_request' || github.event_name == 'merge_group' || github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        include:
          - check: wild
            targets: .#checks.x86_64-linux.wild
          - check: adapters
            targets: .#checks.x86_64-linux.adapterGcc .#checks.x86_64-linux.adapter-llvm
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    name: Nix/${{ matrix.check }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Install Nix
        uses: nixbuild/nix-quick-install-action@v35

      - name: Restore Nix store
        uses: nix-community/cache-nix-action/restore@v7
        id: cache
        with:
          primary-key: nix-${{ runner.os }}-${{ hashFiles('flake.lock', 'Cargo.lock', '**/Cargo.toml', '**/*.nix', '.cargo/config.toml', '.github/workflows/nix.yml') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-

      - name: Run ${{ matrix.check }}
        run: |
          read -r -a targets <<< "$NIX_TARGETS"
          nix build "${targets[@]}" -L --show-trace
        env:
          NIX_TARGETS: ${{ matrix.targets }}

  reuse-check:
    if: github.event_name == 'pull_request' || github.event_name == 'merge_group' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0
          submodules: recursive

      - name: REUSE Compliance Check
        uses: fsfe/reuse-action@v6
